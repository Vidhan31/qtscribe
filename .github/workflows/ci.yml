name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changed Files
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      cpp: ${{ steps.filter.outputs.cpp }}
      qml: ${{ steps.filter.outputs.qml }}
      workflows_scripts: ${{ steps.filter.outputs.workflows_scripts }}
      version: ${{ steps.filter.outputs.version }}
      changelog: ${{ steps.filter.outputs.changelog }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect file changes
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            cpp:
              - 'src/**/*.{cpp,h}'
              - 'tests/**'
              - 'cmake/**'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
            qml:
              - 'src/ui/**/*.qml'
              - 'src/ui/CMakeLists.txt'
            workflows_scripts:
              - '.github/**'
              - 'packaging/**'
              - 'scripts/**'
            version:
              - 'VERSION'
            changelog:
              - 'CHANGELOG.md'

  validate-version:
    name: Validate VERSION File (Semantic Versioning)
    runs-on: ubuntu-24.04
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.version == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check VERSION file format
        run: |
          test -f VERSION || (echo "ERROR: VERSION file is missing" && exit 1)
          APP_VER=$(tr -d '[:space:]' < VERSION)
          echo "Canonical version in VERSION: ${APP_VER}"
          if ! [[ "${APP_VER}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: VERSION '${APP_VER}' does not follow Semantic Versioning (X.Y.Z)"
            exit 1
          fi
          echo "VERSION file format is valid semver."

  validate-changelog:
    name: Validate CHANGELOG.md (Keep a Changelog)
    runs-on: ubuntu-24.04
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.changelog == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate CHANGELOG format
        uses: mindsers/changelog-reader-action@1faaf50aa09d5793d9a100819973df801febfb31 # v2.4.0
        with:
          path: ./CHANGELOG.md
          validation_level: error

  lint-and-format:
    name: Code Quality, Formatting & Linting (pre-commit)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pre-commit and clang-format
        run: pip install pre-commit clang-format==22.1.8

      - name: Cache pre-commit environments
        # zizmor: ignore[cache-poisoning]
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit hooks
        run: |
          echo "Running pre-commit hooks on all files..."
          pre-commit run --all-files --show-diff-on-failure

  lint-workflows-and-scripts:
    name: Lint Workflows & Scripts (zizmor, hadolint, shellcheck)
    runs-on: ubuntu-24.04
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.workflows_scripts == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor security audit on GitHub Actions
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          min-severity: medium

      - name: Run hadolint on Dockerfiles
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/mnt:ro" -w /mnt hadolint/hadolint:latest hadolint \
            packaging/deb/Dockerfile.deb \
            packaging/rpm/Dockerfile.rpm \
            packaging/arch/Dockerfile.arch

      - name: Run shellcheck on packaging scripts
        run: |
          shellcheck \
            --exclude=SC2034,SC2154,SC2164 \
            packaging/deb/build-deb.sh \
            packaging/rpm/build-rpm.sh \
            packaging/arch/build-arch.sh \
            packaging/deb/postinst \
            packaging/deb/prerm \
            packaging/deb/postrm \
            packaging/arch/qtscribe.install \
            packaging/arch/PKGBUILD \
            scripts/ci/check-wayland-only.sh

      - name: Verify .SRCINFO is in sync with PKGBUILD
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/packaging/arch:/pkg:ro" \
            archlinux:base-devel@sha256:61f7de2dd88cc4ba1fe36c24cfe1a503c3936984492d6405eeab013ce6ac68c5 \
            bash -c "useradd -m u && cp /pkg/PKGBUILD /pkg/qtscribe.install /home/u/ && chown -R u:u /home/u && su u -c 'cd /home/u && makepkg --printsrcinfo'" > /tmp/generated-srcinfo
          if ! diff -u packaging/arch/.SRCINFO /tmp/generated-srcinfo; then
            echo "ERROR: packaging/arch/.SRCINFO is out of sync with PKGBUILD."
            echo "Regenerate with: makepkg --printsrcinfo > packaging/arch/.SRCINFO"
            exit 1
          fi

  lint-qml:
    name: QML Linting & AOT Verification (qmllint & aotstats)
    runs-on: ubuntu-24.04
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.qml == 'true' || needs.detect-changes.outputs.cpp == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Qt 6.11.1
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.11.1'
          arch: 'linux_gcc_64'
          modules: 'qtmultimedia'
          cache: true
          setup-python: false
          aqtversion: '==3.3.0'

      - name: Install build dependencies
        uses: ./.github/actions/setup-build-deps

      - name: Cache compiler objects
        # zizmor: ignore[cache-poisoning]
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-lint-qml-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-lint-qml-

      - name: Configure CMake
        run: |
          cmake -B build -S . -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR};/usr/lib/x86_64-linux-gnu" \
            -DENABLE_QT_DEPLOYMENT=OFF \
            -DBUILD_KEYINJECTORD=ON

      - name: Run qmllint on QML codebase
        run: |
          ninja -C build all_qmllint

      - name: Generate AOT compilation stats
        run: |
          cmake --build build --target all_aotstats
          test -f build/.rcc/qmlcache/all_aotstats.txt
          cp build/.rcc/qmlcache/all_aotstats.txt build/all_aotstats.txt
          ccache --show-stats

      - name: Upload QML AOT stats artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qml-aotstats
          path: build/all_aotstats.txt
          if-no-files-found: error

  analyze:
    name: Static Analysis (clang-tidy)
    runs-on: ubuntu-24.04
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.cpp == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Qt 6.11.1
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.11.1'
          arch: 'linux_gcc_64'
          modules: 'qtmultimedia'
          cache: true
          setup-python: false
          aqtversion: '==3.3.0'

      - name: Install Clang, Clang-Tidy and Build Tools
        uses: ./.github/actions/setup-build-deps
        with:
          extra-packages: "clang-18 clang-tidy-18"

      - name: Cache compiler objects
        # zizmor: ignore[cache-poisoning]
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-clang-tidy-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-clang-tidy-

      - name: Configure CMake with Clang and Clang-Tidy
        run: |
          cmake -B build -S . -GNinja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR};/usr/lib/x86_64-linux-gnu" \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DENABLE_CLANG_TIDY=ON \
            -DENABLE_QT_DEPLOYMENT=OFF \
            -DBUILD_KEYINJECTORD=ON

      - name: Run Clang-Tidy on first-party targets
        run: |
          ninja -C build qtscribe_core keyinjectord qtscribe
          ccache --show-stats

  sanitizers:
    name: Sanitizers (${{ matrix.name }})
    runs-on: ubuntu-24.04
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.cpp == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan-ubsan
            preset: ci-sanitizer
          - name: tsan
            preset: ci-sanitizer-tsan
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Qt 6.11.1
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.11.1'
          arch: 'linux_gcc_64'
          modules: 'qtmultimedia'
          cache: true
          setup-python: false
          aqtversion: '==3.3.0'

      - name: Install build dependencies and sanitizer runtime libraries
        uses: ./.github/actions/setup-build-deps
        with:
          extra-packages: "libasan8 libubsan1 libtsan2"

      - name: Cache compiler objects
        # zizmor: ignore[cache-poisoning]
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.name }}-

      - name: Configure CMake with ${{ matrix.name }}
        run: |
          cmake --preset ${{ matrix.preset }} \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR};/usr/lib/x86_64-linux-gnu" \
            -DENABLE_QT_DEPLOYMENT=OFF

      - name: Build targets under ${{ matrix.name }}
        run: |
          cmake --build --preset ${{ matrix.preset }}
          ccache --show-stats

      - name: Run test suite under ${{ matrix.name }}
        run: |
          ctest --preset ${{ matrix.preset }} --output-on-failure

  package-validation:
    name: Package Validation (${{ matrix.name }})
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: deb
            name: Debian (.deb)
            file: packaging/deb/Dockerfile.deb
            outdir: dist/deb
          - target: arch
            name: Arch Linux (.pkg.tar.zst)
            file: packaging/arch/Dockerfile.arch
            outdir: dist/arch
          - target: rpm
            name: Fedora RPM (.rpm)
            file: packaging/rpm/Dockerfile.rpm
            outdir: dist/rpm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read version from VERSION file
        id: get-version
        run: |
          APP_VER=$(tr -d '[:space:]' < VERSION)
          echo "version=${APP_VER}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build & Validate ${{ matrix.name }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: export
          outputs: type=local,dest=./${{ matrix.outdir }}
          build-args: |
            APP_VERSION=${{ steps.get-version.outputs.version }}
          cache-from: type=gha,scope=pkg-${{ matrix.target }}
          cache-to: type=gha,mode=min,scope=pkg-${{ matrix.target }}

      - name: Verify package artifacts
        run: |
          echo "Listing generated package artifacts in ./${{ matrix.outdir }}:"
          ls -lh ./${{ matrix.outdir }}
          if [ -z "$(ls -A ./${{ matrix.outdir }})" ]; then
            echo "ERROR: No package artifacts found in ./${{ matrix.outdir }}"
            exit 1
          fi

      - name: Assert Wayland-only packaging config
        if: matrix.target == 'deb'
        run: bash scripts/ci/check-wayland-only.sh

name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL Analysis (C++)
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          languages: c-cpp
          queries: +security-and-quality
          config-file: .github/codeql/codeql-config.yml

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Qt 6.11.1
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.11.1'
          arch: 'linux_gcc_64'
          modules: 'qtmultimedia'
          cache: true
          setup-python: false
          aqtversion: '==3.3.0'

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            pkg-config \
            libwayland-dev \
            wayland-protocols \
            qtkeychain-qt6-dev \
            libsecret-1-dev \
            libevdev-dev \
            libcap-dev \
            libasound2-dev \
            libpulse-dev

      - name: Configure CMake
        run: |
          cmake -B build -S . -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR};/usr/lib/x86_64-linux-gnu" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DENABLE_QT_DEPLOYMENT=OFF \
            -DBUILD_KEYINJECTORD=ON

      - name: Build C++ targets for CodeQL
        run: |
          ninja -C build qtscribe_core keyinjectord qtscribe

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          category: "/language:c-cpp"
